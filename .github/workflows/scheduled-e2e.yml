name: Scheduled Full Cross-Browser Regression

on:
  schedule:
    - cron: '0 2 * * *' # Executes daily at 02:00 UTC
  workflow_dispatch:

jobs:
  full-regression:
    name: Full Cross-Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Quality Engineering Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install All Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Full Test Suites
        run: npx playwright test

      - name: Upload Full Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-report
          path: playwright-report/
          retention-days: 14
