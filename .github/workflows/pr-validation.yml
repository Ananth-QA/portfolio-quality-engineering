name: PR Quality Gate & Smoke Suite

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BASE_URL: https://ananth-portfolio-xi.vercel.app
  CI: 'true'

jobs:
  smoke-validation:
    name: Smoke Test & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Quality Engineering Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Execute Smoke Test Suite (@smoke)
        run: npx playwright test tests/smoke --project="Desktop Chrome"

      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7
